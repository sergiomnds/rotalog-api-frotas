# RotaLog - API Frotas Configuration
# Legacy configuration with intentional debt

# Server
server.port=8080
server.servlet.context-path=/api

# Database - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/rotalog?currentSchema=frotas
spring.datasource.username=rotalog_admin
spring.datasource.password=rotalog123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=frotas

# Flyway
# Flyway - DESABILITADO: schema e seed gerenciados pelo docker-compose
# FIXME: deveria usar Flyway corretamente em vez de init scripts no docker
spring.flyway.enabled=false
#spring.flyway.locations=classpath:db/migration
#spring.flyway.schemas=frotas
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=2

# Logging
logging.level.root=INFO
logging.level.com.rotalog=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Destinatário das notificações de veículo
rotalog.notificacao.gestor=gestor@rotalog.com

# Manutenção preventiva: veículo ativo é elegível se rodou mais de X km ou passou de X meses desde a última manutenção
rotalog.manutencao.preventiva.limite-km=10000
rotalog.manutencao.preventiva.limite-meses=6

# api-notificacoes: URL e timeouts (a requisição de veículo não pode ficar presa se ela travar)
rotalog.api.notificacoes.url=http://localhost:5000
rotalog.api.notificacoes.connect-timeout-ms=2000
rotalog.api.notificacoes.read-timeout-ms=5000

# Paginação das listagens (?page=&size=&sort=)
spring.data.web.pageable.default-page-size=100
spring.data.web.pageable.max-page-size=500

